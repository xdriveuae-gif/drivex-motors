<!DOCTYPE html>
<html lang="en">
<head>
  {{GA_TAG}}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />

  <title>{{TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}" />
  <meta name="keywords" content="{{META_KEYWORDS}}" />
  <meta name="author" content="{{SITE_NAME}}" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="{{CANONICAL}}" />
  <meta name="csrf-token" content="{{CSRF_TOKEN}}" />

  <!-- Open Graph -->
  <meta property="og:type" content="{{OG_TYPE}}" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{OG_DESCRIPTION}}" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta property="og:url" content="{{OG_URL}}" />
  <meta property="og:site_name" content="{{SITE_NAME}}" />
  <meta property="og:locale" content="en_AE" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{OG_TITLE}}" />
  <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
  <meta name="twitter:image" content="{{OG_IMAGE}}" />

  <link rel="icon" href="/favicon.svg?v={{ASSET_VER}}" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/images/logo.png?v={{ASSET_VER}}" />
  <link rel="preconnect" href="https://www.google.com" />
  <script src="/js/theme.js?v={{ASSET_VER}}"></script>
  <link rel="stylesheet" href="/css/styles.css?v={{ASSET_VER}}" />

  <!-- Organisation structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "AutoDealer",
    "name": "{{SITE_NAME}}",
    "image": "{{SITE_URL}}/images/og-default.svg",
    "url": "{{SITE_URL}}",
    "telephone": "{{SITE_PHONE_RAW}}",
    "email": "{{SITE_EMAIL}}",
    "priceRange": "AED",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{SITE_ADDRESS}}",
      "addressLocality": "Abu Dhabi",
      "addressCountry": "AE"
    },
    "openingHours": "Sa-Th 09:00-21:00"
  }
  </script>
  {{JSON_LD}}

  <script src="/js/main.js?v={{ASSET_VER}}" defer></script>
  <script src="/js/i18n.js?v={{ASSET_VER}}" defer></script>
</head>
<body class="{{BODY_CLASS}}"
      data-site="{{SITE_NAME}}"
      data-phone="{{SITE_PHONE_RAW}}"
      data-phone-display="{{SITE_PHONE}}"
      data-landline="{{SITE_LANDLINE_RAW}}"
      data-whatsapp="{{SITE_WHATSAPP}}"
      data-email="{{SITE_EMAIL}}"
      data-currency="{{SITE_CURRENCY}}"
      data-url="{{SITE_URL}}"
      data-warranty="{{WARRANTY_BADGE}}">

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      {{> partials/logo }}

      <nav class="main-nav" id="mainNav" aria-label="Primary navigation">
        <a href="/" class="nav-link" data-nav="/">Home</a>
        <a href="/inventory" class="nav-link" data-nav="/inventory">Buy a Car</a>
        <a href="/finance" class="nav-link" data-nav="/finance">Finance</a>
        <a href="/about" class="nav-link" data-nav="/about">About</a>
        <a href="/contact" class="nav-link" data-nav="/contact">Contact</a>
        <a href="tel:{{SITE_PHONE_RAW}}" class="nav-phone">{{SITE_PHONE}}</a>
        <div class="nav-tools">
          <button type="button" class="icon-btn theme-toggle" id="themeToggle" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" class="lang-btn" id="langToggle" lang="ar" aria-label="التبديل إلى العربية" data-no-i18n>العربية</button>
        </div>
        <a href="/sell-your-car" class="btn btn-gold btn-sm nav-cta" data-nav="/sell-your-car">Sell / Trade-in</a>
      </nav>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mainNav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="main">
