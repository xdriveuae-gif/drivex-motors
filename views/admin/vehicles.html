{{> partials/admin-head }}

<section class="admin-panel">
  <div class="panel-head vehicles-head">
    <div class="ph-heading">
      <h2 id="vehiclesHeading">Manage Vehicles</h2>
      <span class="muted" id="vehiclesCount"></span>
    </div>
    <a href="/admin/vehicles/new" class="btn btn-gold btn-sm">＋ Add Vehicle</a>
  </div>

  <div class="vehicles-toolbar">
    <div class="search-box admin-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 104.5 10.1l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg>
      <input type="search" id="adminSearch" placeholder="Search title, make, model, VIN…" autocomplete="off" />
    </div>
    <select id="statusFilter" class="status-filter">
      <option value="">All vehicles</option>
      <option value="available">Available</option>
      <option value="sold">Sold</option>
    </select>
    <select id="sortSelect" class="status-filter">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
      <option value="mileage_asc">Mileage: Lowest</option>
      <option value="mileage_desc">Mileage: Highest</option>
      <option value="year_desc">Year: Newest</option>
      <option value="year_asc">Year: Oldest</option>
      <option value="views_desc">Most viewed</option>
    </select>
    <button type="button" class="btn btn-outline btn-sm" id="advFilterToggle">Filters</button>
  </div>

  <div class="admin-filters" id="advFilterPanel" hidden>
    <div class="filter-group">
      <label for="af-make">Make</label>
      <select id="af-make"><option value="">All makes</option></select>
    </div>
    <div class="filter-group">
      <label for="af-model">Model</label>
      <select id="af-model" disabled><option value="">All models</option></select>
    </div>
    <div class="filter-group">
      <label for="af-year">Year</label>
      <select id="af-year"><option value="">All years</option></select>
    </div>
    <div class="filter-group">
      <label for="af-color">Color</label>
      <select id="af-color"><option value="">All colors</option></select>
    </div>
    <div class="filter-group">
      <label>Price (AED)</label>
      <div class="range-row">
        <input type="number" id="af-price-min" placeholder="Min" inputmode="numeric" />
        <span>–</span>
        <input type="number" id="af-price-max" placeholder="Max" inputmode="numeric" />
      </div>
    </div>
    <div class="filter-group">
      <label for="af-mileage">Max Mileage (km)</label>
      <input type="number" id="af-mileage" placeholder="Any" inputmode="numeric" />
    </div>
    <div class="filter-group filter-actions">
      <button type="button" class="btn btn-gold btn-sm" id="advFilterApply">Apply</button>
      <button type="button" class="link-btn" id="advFilterReset">Reset</button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Vehicle</th>
          <th>Year</th>
          <th>Price</th>
          <th>Mileage</th>
          <th>Sold</th>
          <th>Published</th>
          <th class="ta-right">Actions</th>
        </tr>
      </thead>
      <tbody id="vehiclesTbody">
        <tr><td colspan="7" class="muted ta-center">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <nav class="pagination" id="adminPagination" aria-label="Vehicle pages"></nav>
</section>

<script src="/js/admin-vehicles.js?v={{ASSET_VER}}" defer></script>
{{> partials/admin-footer }}
